<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글 수정 - 포켓몬 게시판</title>
  <link rel="icon" href="https://user-images.githubusercontent.com/13339993/205411205-2d68d732-9413-46fe-9550-ba6f214b3433.png" type="image/x-icon">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="write-container">
    <h1>글 수정</h1>
    <form id="edit-form">
      <div class="form-group">
        <label for="title">제목</label>
        <input type="text" id="title" name="title" required>
      </div>
      <div class="form-group">
        <label for="content">내용</label>
        <textarea id="content" name="content" rows="15" required></textarea>
      </div>
      <div class="form-buttons">
        <button type="submit" class="btn btn-submit">수정 완료</button>
        <a href="#" id="cancel-button" class="btn btn-cancel">취소</a>
      </div>
    </form>
  </div>
  <script src="/js/edit.js"></script>
</body>
</html>
