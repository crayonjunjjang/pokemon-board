<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 페이지</title>
  <link rel="icon" href="https://user-images.githubusercontent.com/13339993/205411205-2d68d732-9413-46fe-9550-ba6f214b3433.png" type="image/x-icon">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="main-container">
    <div class="top-bar-container">
      <div id="auth-links">
        <a href="/">메인으로</a>
      </div>
    </div>
    <div class="board-container">
      <h1>관리자 페이지</h1>
      
      <h2>사용자 관리</h2>
      <table class="board-table">
        <thead>
          <tr>
            <th class="col-id">ID</th>
            <th class="col-author">이름</th>
            <th class="col-author">유저네임</th>
            <th class="col-actions">작업</th>
          </tr>
        </thead>
        <tbody id="users-body">
          <!-- 사용자 데이터가 여기에 추가됩니다. -->
        </tbody>
      </table>

      <h2 style="margin-top: 50px;">게시글 관리</h2>
      <table class="board-table">
        <thead>
          <tr>
            <th class="col-id">번호</th>
            <th class="col-title">제목</th>
            <th class="col-author">글쓴이</th>
            <th class="col-date">작성일</th>
            <th class="col-actions">작업</th>
          </tr>
        </thead>
        <tbody id="posts-body">
          <!-- 게시글 데이터가 여기에 추가됩니다. -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
