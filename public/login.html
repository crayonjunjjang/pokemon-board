<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - 포켓몬 게시판</title>
  <link rel="icon" href="https://user-images.githubusercontent.com/13339993/205411205-2d68d732-9413-46fe-9550-ba6f214b3433.png" type="image/x-icon">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-container">
    <h1>로그인</h1>
    <form id="login-form">
      <div class="form-group">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="form-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" required>
      </div>
      <div class="form-buttons">
        <button type="submit" class="btn btn-submit">로그인</button>
      </div>
      <p class="auth-switch">계정이 없으신가요? <a href="/register.html">회원가입</a></p>
    </form>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
